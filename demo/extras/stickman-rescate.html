<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stickman superhéroe: el rescate</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light dark;
  --page:#EEF0F5; --text:#1A1F3A; --muted:#55597A;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --page:#0E0B1F; --text:#F4F1FA; --muted:#A7A2C8; }
}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;background:var(--page);color:var(--text);font-family:"Bricolage Grotesque",system-ui,sans-serif;line-height:1.5}
main{max-width:960px;margin:0 auto;padding:20px 14px 40px}
h1{font-size:clamp(1.4rem,4.5vw,2rem);font-weight:800;margin:0 0 4px}
p{margin:0 0 14px;color:var(--muted)}
.stage{border-radius:12px;overflow:hidden;background:#2B1B54}
canvas{display:block;width:100%;cursor:pointer;touch-action:manipulation}
</style>
</head>
<body>
<main>
  <h1>Stickman al rescate</h1>
  <p>Alguien cae del cielo y el superhéroe lo salva. La escena dura 18 segundos y se repite. Toca para que haga un giro aéreo.</p>
  <div class="stage"><canvas id="c" role="img" aria-label="Un hombre de palitos con capa roja atrapa a una persona que cae, la baja a la calle y ella le da las gracias"></canvas></div>
</main>
<script>
(function(){
  var cv=document.getElementById('c'), ctx=cv.getContext('2d');
  var W,H,dpr,start=performance.now(),last=start,S=0,Sland=0,landed=false,boost=-10;
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  var T=18;
  function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;var t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
  function clamp(x,a,b){return Math.max(a,Math.min(b,x))}
  function ss(x){x=clamp(x,0,1);return x*x*(3-2*x)}
  function lerp(a,b,u){return a+(b-a)*u}
  function size(){dpr=Math.min(window.devicePixelRatio||1,2);W=cv.parentElement.clientWidth;H=Math.round(W*9/16);cv.width=W*dpr;cv.height=H*dpr;cv.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}

  var layers=[
    {sp:18, col:'#5B4690', hMin:.22,hMax:.5,  wMin:50,wMax:100, win:false, seed:3},
    {sp:55, col:'#33296A', hMin:.18,hMax:.46, wMin:60,wMax:120, win:true,  seed:5},
    {sp:130,col:'#17133A', hMin:.12,hMax:.38, wMin:70,wMax:140, win:true,  seed:9}
  ];
  layers.forEach(function(L){
    var r=rng(L.seed),x=0;L.b=[];
    while(x<1800){var w=L.wMin+r()*(L.wMax-L.wMin);L.b.push({x:x,w:w,h:L.hMin+r()*(L.hMax-L.hMin),s:r()*1000,roof:r()<.3});x+=w+r()*8}
    L.len=x;
  });
  var clouds=[],stars=[],lines=[],i,r0=rng(21);
  for(i=0;i<8;i++)clouds.push({x:r0(),y:.08+r0()*.3,s:.6+r0()*.9,v:4+r0()*8});
  for(i=0;i<70;i++)stars.push({x:r0(),y:r0()*.4,r:.5+r0()*1,p:r0()*6});
  for(i=0;i<16;i++)lines.push({x:r0(),y:.15+r0()*.6,l:60+r0()*120,v:.7+r0()*.9});

  function drawCity(t,k){
    layers.forEach(function(L,li){
      var off=(S*L.sp*k)%L.len;
      for(var rep=-1;rep<=1;rep++){
        L.b.forEach(function(b){
          var x=b.x-off+rep*L.len; if(x>W+160||x+b.w<-10)return;
          var bh=b.h*H, y=H-bh;
          ctx.fillStyle=L.col; ctx.fillRect(x,y,b.w,bh+2);
          if(b.roof)ctx.fillRect(x+b.w*.45,y-14*k,3*k,14*k);
          if(L.win){
            var cw=9*k,ch=11*k,gx=16*k,gy=20*k, rr=rng(b.s|0);
            for(var wy=y+10*k;wy<H-10*k;wy+=gy)for(var wx=x+8*k;wx<x+b.w-cw-4;wx+=gx){
              var on=rr()<.42, fl=rr()<.04&&Math.sin(t*3+wx)>.6;
              if(on&&!fl){ctx.fillStyle=li===1?'rgba(255,210,122,.55)':'rgba(255,210,122,.9)';ctx.fillRect(wx,wy,cw,ch)}
            }
          }
        });
      }
    });
  }

  function hero(t,hx,hy,tilt,flip,k){
    ctx.save(); ctx.translate(hx,hy); ctx.rotate(tilt-flip*6.283); ctx.scale(k,k);
    ctx.lineCap='round'; ctx.lineJoin='round';
    var N=14,top=[],bot=[];
    for(var n=0;n<=N;n++){var u=n/N;
      var wv=Math.sin(t*9-u*5.5)*13*u, x=16-u*100;
      top.push([x,-3+wv+u*5]); bot.push([x,5+wv+u*22+5.6*(1-u)]);
    }
    ctx.beginPath(); ctx.moveTo(top[0][0],top[0][1]);
    top.forEach(function(p){ctx.lineTo(p[0],p[1])});
    for(n=N;n>=0;n--)ctx.lineTo(bot[n][0],bot[n][1]);
    ctx.closePath(); ctx.fillStyle='#E8344E'; ctx.fill();
    ctx.strokeStyle='#8E1630'; ctx.lineWidth=2; ctx.stroke();
    ctx.strokeStyle='#0F0C26'; ctx.lineWidth=6;
    var lw=Math.sin(t*10)*4;
    ctx.beginPath(); ctx.moveTo(18,0); ctx.lineTo(-24,3); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(14,0); ctx.lineTo(48,-6); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(10,2); ctx.lineTo(30,13); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-24,3); ctx.lineTo(-54,-3+lw); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-24,3); ctx.lineTo(-52,12-lw); ctx.stroke();
    ctx.strokeStyle='#FFC53D'; ctx.lineWidth=4; ctx.beginPath(); ctx.moveTo(-20,-1); ctx.lineTo(-20,8); ctx.stroke();
    ctx.fillStyle='#FFC53D'; ctx.beginPath();
    for(var s=0;s<10;s++){var a=-1.57+s*.628,rad=s%2?3.2:7;ctx.lineTo(2+Math.cos(a)*rad,3+Math.sin(a)*rad)}
    ctx.closePath(); ctx.fill();
    ctx.fillStyle='#F4F1FA'; ctx.strokeStyle='#0F0C26'; ctx.lineWidth=5;
    ctx.beginPath(); ctx.arc(32,-10,12,0,6.283); ctx.fill(); ctx.stroke();
    ctx.fillStyle='#E8344E'; ctx.fillRect(28,-16,15,6);
    ctx.fillStyle='#F4F1FA'; ctx.fillRect(36,-14.5,3,3);
    ctx.restore();
  }

  // persona (origen en la cadera)
  function person(t,x,y,mode,rot,s){
    ctx.save(); ctx.translate(x,y); ctx.rotate(rot); ctx.scale(s,s);
    ctx.lineCap='round'; ctx.lineJoin='round';
    var w=Math.sin(t*14)*6, sw=Math.sin(t*2)*3, ax,ay,bx,by,lx,ly,mx,my;
    ctx.lineWidth=5;
    // piernas
    if(mode==='fall'){lx=-10+w;ly=22;mx=10-w;my=20}
    else if(mode==='carry'){lx=-6+sw;ly=24;mx=7-sw;my=23}
    else{lx=-8;ly=24;mx=8;my=24}
    ctx.strokeStyle='#0F0C26';
    ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(lx,ly);ctx.stroke();
    ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(mx,my);ctx.stroke();
    // brazos
    if(mode==='fall'){ax=-15;ay=-44+w;bx=15;by=-44-w}
    else if(mode==='carry'){ax=-9;ay=-8;bx=9;by=-9}
    else{ax=-8;ay=-3;bx=14+Math.sin(t*8)*5;by=-44}
    ctx.beginPath();ctx.moveTo(0,-22);ctx.lineTo(ax,ay);ctx.stroke();
    ctx.beginPath();ctx.moveTo(0,-22);ctx.lineTo(bx,by);ctx.stroke();
    // torso y cabeza
    ctx.strokeStyle='#2EC4B6'; ctx.lineWidth=7;
    ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,-26);ctx.stroke();
    ctx.fillStyle='#F4F1FA'; ctx.strokeStyle='#0F0C26'; ctx.lineWidth=4;
    ctx.beginPath();ctx.arc(0,-35,9,0,6.283);ctx.fill();ctx.stroke();
    if(mode==='fall'){ctx.fillStyle='#0F0C26';ctx.beginPath();ctx.ellipse(1,-33,3,3.5,0,0,6.283);ctx.fill()}
    else{ctx.strokeStyle='#0F0C26';ctx.lineWidth=2;ctx.beginPath();ctx.arc(1,-34,4,.2,2.9);ctx.stroke()}
    ctx.restore();
  }

  function bubble(text,x,y,k){
    ctx.font='800 '+(16*k+6)+'px "Bricolage Grotesque",system-ui,sans-serif';
    var tw=ctx.measureText(text).width, pw=14*k+4, bh=30*k+10, bw=tw+pw*2;
    var bx=clamp(x,8,W-bw-8), by=Math.max(y,8), r=10;
    ctx.fillStyle='#FFFFFF'; ctx.strokeStyle='#0F0C26'; ctx.lineWidth=3;
    ctx.beginPath();
    ctx.moveTo(bx+r,by);ctx.arcTo(bx+bw,by,bx+bw,by+bh,r);ctx.arcTo(bx+bw,by+bh,bx,by+bh,r);
    ctx.lineTo(bx+16,by+bh);ctx.lineTo(bx+6,by+bh+12*k+4);ctx.lineTo(bx+4,by+bh);
    ctx.arcTo(bx,by+bh,bx,by,r);ctx.arcTo(bx,by,bx+bw,by,r);ctx.closePath();ctx.fill();ctx.stroke();
    ctx.fillStyle='#0F0C26'; ctx.textBaseline='middle'; ctx.fillText(text,bx+pw,by+bh/2+1);
  }

  function frame(now){
    var dt=Math.min((now-last)/1000,.05); last=now;
    var t=reduce?11:(now-start)/1000, c=t%T, k=W/960, sc=k*1.25, ps=k*1.1;
    var mult=c<7?1:c<9.5?1-ss((c-7)/2.5):c<13.5?0:c<15.5?ss((c-13.5)/2):1;
    if(!reduce)S+=dt*mult;
    if(c<9.5)landed=false; else if(!landed){Sland=S;landed=true}
    var f=clamp((t-boost)/1,0,1), flip=ss(f), bump=Math.sin(f*Math.PI);
    var streetY=H*.88, gs=layers[2].sp*k;

    // cielo, sol, nubes
    var g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#2B1B54'); g.addColorStop(.55,'#C2507F'); g.addColorStop(.85,'#FF9E6B'); g.addColorStop(1,'#FFC27A');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    stars.forEach(function(s){ctx.fillStyle='rgba(255,255,255,'+(.35+.35*Math.sin(t*1.5+s.p))*(1-s.y*2)+')';ctx.beginPath();ctx.arc(s.x*W,s.y*H,s.r*k+.3,0,6.283);ctx.fill()});
    var sg=ctx.createRadialGradient(W*.78,H*.62,0,W*.78,H*.62,H*.5);
    sg.addColorStop(0,'rgba(255,240,200,1)'); sg.addColorStop(.12,'rgba(255,214,150,.95)'); sg.addColorStop(.13,'rgba(255,190,120,.5)'); sg.addColorStop(1,'rgba(255,170,110,0)');
    ctx.fillStyle=sg; ctx.fillRect(0,0,W,H);
    clouds.forEach(function(cl){var x=((cl.x*W-t*cl.v*k)%(W+300)+W+300)%(W+300)-150,y=cl.y*H;
      ctx.fillStyle='rgba(255,200,190,.28)';
      for(var q=0;q<4;q++){ctx.beginPath();ctx.ellipse(x+q*34*cl.s*k,y+(q%2)*5*k,60*cl.s*k,15*cl.s*k,0,0,6.283);ctx.fill()}});
    drawCity(t,k);

    // calle
    ctx.fillStyle='#0F0C26'; ctx.fillRect(0,streetY,W,H-streetY);
    ctx.fillStyle='#3A2F78'; ctx.fillRect(0,streetY,W,3*k);
    ctx.fillStyle='#FFC53D';
    var dw=46*k, dg=40*k, per=dw+dg, doff=(S*gs)%per;
    for(var dx=-per-doff;dx<W+per;dx+=per)ctx.fillRect(dx+per,streetY+(H-streetY)*.55,dw,3*k);

    // líneas de velocidad
    ctx.strokeStyle='rgba(255,255,255,'+(.35*mult)+')'; ctx.lineWidth=2*k;
    if(mult>.02)lines.forEach(function(l){var x=W-((S*l.v*.9+l.x)%1.2)*W*1.2+W*.1,y=l.y*H;
      ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+l.l*k,y);ctx.stroke()});

    // posiciones clave
    var B={x:W*.38,y:H*.36+Math.sin(t*1.7)*10*k-bump*10*k};
    var C={x:W*.6,y:H*.5};
    var L={x:W*.42,y:streetY-88*k+Math.sin(t*2)*3*k};
    var standX=W*.55, standHipY=streetY-24*ps;
    function carry(h,tilt){var ox=44*sc,oy=18*sc;return{x:h.x+Math.cos(tilt)*ox-Math.sin(tilt)*oy,y:h.y+Math.sin(tilt)*ox+Math.cos(tilt)*oy}}

    var hp=B, tilt=-.18, pp=null, pmode='', prot=0, bub='';
    var u;
    if(c<4.2){hp=B}
    else if(c<6.2){ // pica hacia la persona
      u=ss((c-4.2)/2); hp={x:lerp(B.x,C.x,u),y:lerp(B.y,C.y,u)}; tilt=lerp(-.18,.55,Math.sin(u*Math.PI)*.9)-.18*u+.18*0;
    }
    else if(c<6.8){u=(c-6.2)/.6; hp=C; tilt=lerp(-.18,-.45,Math.sin(u*Math.PI));}
    else if(c<9.5){u=ss((c-6.8)/2.7); hp={x:lerp(C.x,L.x,u),y:lerp(C.y,L.y,u)}; tilt=-.1+.35*Math.sin(u*Math.PI)*.5;}
    else if(c<13.5){hp=L; tilt=-.05;}
    else if(c<15.5){u=ss((c-13.5)/2); hp={x:lerp(L.x,B.x,u),y:lerp(L.y,B.y,u)}; tilt=lerp(-.05,-.18,u)-.25*Math.sin(u*Math.PI);}
    // la persona
    var cp0=carry(C,-.18);
    if(c>=3&&c<6.2){u=(c-3)/3.2; pp={x:cp0.x,y:lerp(-H*.1,cp0.y,Math.pow(u,1.8))}; pmode='fall'; prot=Math.sin(t*9)*.25; if(c>3.3)bub='¡AYUDA!';}
    else if(c>=6.2&&c<9.5){pp=carry(hp,tilt); pmode='carry'; prot=tilt+1.4;}
    else if(c>=9.5&&c<10.2){u=ss((c-9.5)/.7); var a=carry(L,-.05); pp={x:lerp(a.x,standX,u),y:lerp(a.y,standHipY,u)-Math.sin(u*Math.PI)*8*k}; pmode=u<.6?'carry':'stand'; prot=lerp(-.05+1.4,0,u);}
    else if(c>=10.2){pp={x:standX-(S-Sland)*gs,y:standHipY}; pmode='stand'; prot=0; if(c<13.5)bub='¡GRACIAS!';}

    if(pp&&pp.x>-60&&pp.x<W+60)person(t,pp.x,pp.y,pmode,prot,ps);
    hero(t,hp.x,hp.y,tilt,(c<4.2||c>=15.5)?flip:0,sc);
    if(pp&&bub)bubble(bub,pp.x+22*k,pp.y-86*k,k);

    if(!reduce)requestAnimationFrame(frame);
  }
  size();
  window.addEventListener('resize',function(){size();if(reduce)requestAnimationFrame(frame)});
  cv.addEventListener('pointerdown',function(){boost=(performance.now()-start)/1000});
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
